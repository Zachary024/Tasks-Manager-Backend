<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main>
        <p id="plus">Add a New Task</p>
        <!-- ORIGINAL: <form action="" id="form">  — kept; the JS now cancels submission,
             but pointing action at "" meant any uncaught submit reloaded the page -->
        <form action="#" id="form">
            <h1>Task Manager</h1>
            <div class="wrapper">
                <!-- FIX: added placeholder + aria-label (input had no visible cue) -->
                <input type="text" id="content" placeholder="What needs to be done?" aria-label="Task">
                <button type="submit" id="submit" title="Add task" aria-label="Add task">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </form>

        <section id="container">
            <!-- <div>
                <p>Take out the trash</p>
                <p>
                    <span><i class="fa-solid fa-trash"></i></span>
                    <span><i class="fa-solid fa-pen-to-square"></i></span>
                </p>
            </div> -->
        </section>

    </main>



    <script src="assets/script.js"></script>
</body>
</html>
